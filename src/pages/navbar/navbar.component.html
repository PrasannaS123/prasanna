<header class="navbar-wrapper sticky-top" [class.scrolled]="isScrolled">
    <div class="container">
        <nav class="navbar navbar-expand-lg">
        <div class="container-fluid px-0">
            <a class="navbar-brand d-flex align-items-center" routerLink="/">
                <div class="circle-text d-flex align-items-center justify-content-center">
                    <span>P</span>
                </div>
                <h5 class="brand-name mb-0 ms-3">PRASANNA<span>.DEV</span></h5>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu"
                aria-controls="mobileMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

                    <li class="nav-item me-lg-3">
                        <a class="nav-link" routerLink="/" routerLinkActive="active"
                            [routerLinkActiveOptions]="{ exact: true }">
                            Home
                        </a>
                    </li>

                    <li class="nav-item me-lg-3">
                        <a class="nav-link" routerLink="/projects" routerLinkActive="active"
                            [routerLinkActiveOptions]="{ exact: true }">Projects</a>
                    </li>
                    <li class="nav-item me-lg-0">
                        <a class="nav-link" routerLink="/contact" routerLinkActive="active"
                            [routerLinkActiveOptions]="{ exact: true }">Contact</a>
                    </li>

                </ul>

            </div>
        </div>
        </nav>
    </div>
</header>

<div class="offcanvas offcanvas-end" tabindex="-1" id="mobileMenu" aria-labelledby="mobileMenuLabel">
    <div class="offcanvas-header">
        <div class="circle-text d-flex align-items-center justify-content-center">
            <span>P</span>
        </div>
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>

    <div class="offcanvas-body">
        <ul class="navbar-nav">
            <li class="nav-item mb-3">
                <a class="nav-link" routerLink="/" routerLinkActive="active" data-bs-dismiss="offcanvas"
                    [routerLinkActiveOptions]="{ exact: true }">
                    Home
                </a>
            </li>

            <li class="nav-item mb-3">
                <a class="nav-link" routerLink="/projects" routerLinkActive="active" data-bs-dismiss="offcanvas"
                    [routerLinkActiveOptions]="{ exact: true }">
                    Projects
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" routerLink="/contact" routerLinkActive="active" data-bs-dismiss="offcanvas"
                    [routerLinkActiveOptions]="{ exact: true }">
                    Contact
                </a>
            </li>
        </ul>
    </div>
</div>
